<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DivisaFácil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>DivisaFácil</h1>
    <p>Conversor de monedas (MVP)</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Selector de moneda</h2>

      <label for="from">De</label>
      <select id="from"></select>

      <label for="to">A</label>
<select id="to"></select>

<label for="amount">Importe</label>
<input
  id="amount"
  type="text"
  inputmode="decimal"
  placeholder="Ej. 100,50"
  aria-describedby="amount-hint"
/>
<small id="amount-hint" class="hint">
  Introduce el importe a convertir
</small>

<div class="actions">
  <button id="swap" class="btn-secondary" type="button" title="Intercambiar divisas">↔</button>
  <button id="reset" class="btn-secondary" type="button" title="Limpiar importe">Reset</button>
</div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
